{% extends 'base.html' %}
{% block content %}
  <h2 class="mb-4">Settings</h2>
  <form method="post" action="/settings" style="max-width: 480px;">
    <div class="mb-3">
      <label class="form-label">Report language</label>
      <select class="form-select" name="report_language">
        <option value="en" {% if report_language == 'en' %}selected{% endif %}>English</option>
        <option value="ru" {% if report_language == 'ru' %}selected{% endif %}>Russian</option>
      </select>
      <div class="form-text">Affects summaries and reports in the backend.</div>
    </div>
    <button class="btn btn-primary" type="submit">Save</button>
  </form>
{% endblock %}
