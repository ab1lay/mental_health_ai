<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or 'Healthcare Web' }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="/">Healthcare Web</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/patients">Patients</a></li>
            <li class="nav-item"><a class="nav-link" href="/alerts">Alerts</a></li>
            <li class="nav-item"><a class="nav-link" href="/invites">Invites</a></li>
            <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
          </ul>
          <div class="text-white small">
            <a class="text-white text-decoration-none me-2" href="/settings" title="Settings">⚙️</a>
            {{ user.email if user else '' }}
            <a class="text-white ms-3" href="/logout">Logout</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container my-4">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
